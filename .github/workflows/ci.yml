name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Tree root ────────────────────────────────────────────────────────────
  # Three parallel branches (lint / typecheck / test) fan out from each push,
  # then converge into the `ci` gate at the bottom. `ci` is the single status
  # check to require for branch protection.

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -v

  # ─── Tree root convergence ────────────────────────────────────────────────
  # A single gate job that succeeds only if every leaf passed. Mark this
  # the required status check in branch protection so contributors only
  # have one box to satisfy.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: always()
    steps:
      - name: gate
        run: |
          if [[ "${{ needs.lint.result }}" != "success" \
             || "${{ needs.typecheck.result }}" != "success" \
             || "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::One or more leaf jobs failed."
            echo "  lint:      ${{ needs.lint.result }}"
            echo "  typecheck: ${{ needs.typecheck.result }}"
            echo "  test:      ${{ needs.test.result }}"
            exit 1
          fi
          echo "All checks passed."
